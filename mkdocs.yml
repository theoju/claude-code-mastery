# mkdocs site config — minimal scaffold added by CCE-57 bootstrap PR.
#
# Why mkdocs (and why not docusaurus): the engineering-docs-agent host config
# requires `framework: mkdocs` or `framework: docusaurus`. mkdocs is the
# smallest scaffold — a single yml file + two pip deps. Docusaurus would
# touch package.json, add Node deps, sidebars.js, and reshape the docs/
# tree. If you prefer Docusaurus, swap this file out, update
# .engineering-docs-agent/config.yml `framework: docusaurus`, and run
# `npx create-docusaurus@latest` inside docs/.

site_name: Claude Code Self-Assessment
site_description: Internal docs for the claude-code-self-assessment dashboard
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

# No `nav:` block — mkdocs auto-builds the nav from docs/ tree. Add an
# explicit nav once the docs grow into stable sections.

# When you add a GitHub Pages publish workflow (e.g.
# .github/workflows/docs-deploy.yml that does `mkdocs gh-deploy`), set
# `.engineering-docs-agent/config.yml`:
#   publishing.build_workflow: docs-deploy.yml
#   publishing.base_url: https://theoju.github.io/claude-code-self-assessment/
# Until then, the engineering-docs-agent's publish-verifier stage will
# skip and the nightly run will surface `verify_skipped` in partial_reasons.
